name: Build app images

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

env:
  MAVEN_ARGS: -Dchangelist=

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            name: Linux (x64)
            runner: ubuntu-24.04
          - platform: linux-arm64
            name: Linux (ARM64)
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            name: Windows (x64)
            runner: windows-2025
          - platform: macos-x64
            name: macOS (Intel)
            runner: macos-15-intel
          - platform: macos-arm64
            name: macOS (Apple silicon)
            runner: macos-15
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Java and cache Maven dependencies
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Java tests on Linux and macOS
        if: runner.os != 'Windows'
        run: ./mvnw -B test
      - name: Run Java tests on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B test
      - name: Package the standalone app
        run: python scripts/build_app.py
      - name: Upload the app ZIP for this platform
        uses: actions/upload-artifact@v6
        with:
          name: jfxtris-${{ matrix.platform }}
          path: target/jfxtris-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
